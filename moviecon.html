    .link-tree {
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
      background-color: #111; 
      box-shadow: 0 0 20px 10px rgb(234, 255, 0); 
      text-align: center;
      position: relative; 
      z-index: 1; 
    }

    .link-tree h1 {
      font-family: 'Orbitron', sans-serif; 
      color: #FFD700; 
      font-size: 40px; 
    }

    .link-tree ul {
      list-style-type: none;
      padding: 0;
    }

    .link-tree ul li.event {
      margin-bottom: 10px;
      border: 1px solid #FFD700; 
      border-radius: 5px;
      padding: 10px;
      opacity: 0; 
      animation: slideUp 1s ease forwards; 
      transition: transform 0.3s; 
    }

    @keyframes slideUp {
      from {
        transform: translateY(100%);
        opacity: 0;
      }
      to {
        transform: translateY(0%);
        opacity: 1;
      }
    }

    /* EVENT DELAYS */
    .link-tree ul li.event:nth-child(1) { animation-delay: 0.5s; }
    .link-tree ul li.event:nth-child(2) { animation-delay: 1s; }
    .link-tree ul li.event:nth-child(3) { animation-delay: 1.5s; }
    .link-tree ul li.event:nth-child(4) { animation-delay: 2.0s; }
    .link-tree ul li.event:nth-child(5) { animation-delay: 2.5s; }
    .link-tree ul li.event:nth-child(6) { animation-delay: 3s; }

    .link-tree ul li.event:nth-child(9) { animation-delay: 4.5s; }
    .link-tree ul li.event:nth-child(10) { animation-delay: 5.0s; }
    

    .link-tree ul li.event:hover {
      transform: scale(1.1); /* Scale up on hover */
    }

    .link-tree ul li.event a {

      color: #FFD700;
